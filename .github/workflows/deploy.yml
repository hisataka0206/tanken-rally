name: Deploy to GitHub Pages

on:
  # main（本番）/ beta（プレビュー）への push でデプロイ
  push:
    branches: [main, beta]
  # Actions タブから手動実行も可能
  workflow_dispatch:

# GitHub Pages にデプロイするための権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に1つのデプロイのみ実行（古いものをキャンセルしない）
concurrency:
  group: "pages"
  cancel-in-progress: false

# サイト構成:
#   /            ← main ブランチ（本番）
#   /beta/       ← beta ブランチ（テスト用プレビュー。無ければスキップ）
# GitHub Pages は1リポジトリ1サイトのため、両ブランチを1つの成果物に同梱してデプロイする。
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout beta (preview at /beta/)
        # beta ブランチが無い場合は失敗するが、本番デプロイは続行する
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: beta
          path: site/beta

      - name: Generate config.js from GitHub Secrets
        # 開発時は config.js (gitignore対象) を手書きするが、
        # 本番デプロイ時は Actions Secrets から動的に生成する（root と /beta/ の両方）
        run: |
          gen_config() {
            cat > "$1" << 'EOF'
          // ⚠️ Auto-generated by GitHub Actions during deployment.
          // ⚠️ Do NOT commit this file. Edit config.example.js as the template.
          export const CONFIG = {
            GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}',
            GAS_URL: '${{ secrets.GAS_URL }}',
            GAS_SECRET: '${{ secrets.GAS_SECRET }}',
          };
          // OpenAI キーはクライアントに出さない（GAS Script Property OPENAI_API_KEY に保持）。
          EOF
            echo "✅ config.js generated: $1"
          }
          gen_config site/config.js
          if [ -f site/beta/index.html ]; then
            gen_config site/beta/config.js
            echo "✅ beta preview included"
          else
            rm -rf site/beta
            echo "ℹ️ beta branch not found — production only"
          fi

      - name: Add .nojekyll & slim artifact
        # ファイル名が _ で始まるものを Jekyll が処理してしまうのを防ぐ。
        # .git はサイトに不要なので成果物から除外する。
        run: |
          touch site/.nojekyll
          rm -rf site/.git site/beta/.git

      - name: Stamp cache-busting version (?v=)
        # 各デプロイで、全アセットの ?v=... をこのコミットの SHA(短縮) に書き換える。
        # → ブラウザキャッシュが毎デプロイ確実に更新され、手動での番号上げ(?v=105→106…)が不要になる。
        #   ソース側の ?v= は固定のプレースホルダのままでよい（ここで上書きされる）。
        #   ?family= 等の無関係なクエリは "?v=" にマッチしないため影響しない。
        run: |
          SHA="${GITHUB_SHA::8}"
          find site -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' \) \
            -not -path '*/.git/*' -print0 \
            | xargs -0 --no-run-if-empty sed -i "s/?v=[0-9A-Za-z._-]*/?v=${SHA}/g"
          echo "✅ Stamped all assets with ?v=${SHA}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
